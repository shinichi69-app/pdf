<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แปลงรูปภาพเป็น PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg-main: #0b0f19;
    --card-bg: rgba(23, 31, 48, 0.7);
    --accent-glow: #8b5cf6;
    --accent-blue: #6366f1;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --border-color: #1e293b;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg-main);
    background-image: 
      radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
    min-height: 100vh;
    padding: 24px;
    color: var(--text-main);
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    overflow: hidden;
  }

  header {
    padding: 28px 32px;
    background: rgba(255, 255, 255, 0.02);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* --- สไตล์ของโลโก้ที่เพิ่มใหม่ --- */
  .logo-box {
    margin-bottom: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
  }
  .logo-box img {
    max-height: 50px; /* ปรับขนาดความสูงโลโก้ตามต้องการ */
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.4));
  }

  header h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p { font-size: 13px; color: var(--text-muted); margin-top: 6px; }

  .body { padding: 32px; }

  #drop {
    border: 2px dashed #334155;
    border-radius: 16px;
    padding: 44px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    background: rgba(30, 41, 59, 0.4);
  }
  #drop:hover, #drop.over {
    border-color: var(--accent-glow);
    background: rgba(139, 92, 246, 0.08);
    box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
    transform: translateY(-2px);
  }
  #drop .icon { font-size: 48px; filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.5)); }
  #drop b { display: block; margin-top: 12px; font-size: 16px; color: var(--text-main); }
  #drop span { font-size: 13px; color: var(--text-muted); margin-top: 4px; display: block; }

  .opts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-top: 28px;
  }
  .opt label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  select, input[type=number] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    font-size: 14px;
    background: #0f172a;
    color: var(--text-main);
    outline: none;
    transition: 0.2s;
  }
  select:focus, input[type=number]:focus {
    border-color: var(--accent-glow);
    box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
  }
  input[type=range] {
    width: 100%;
    accent-color: var(--accent-glow);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
    margin-top: 28px;
  }
  .card {
    position: relative;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    overflow: hidden;
    background: #0f172a;
    cursor: grab;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    border-color: #475569;
  }
  .card.drag { opacity: 0.3; }
  .card img {
    width: 100%;
    height: 120px;
    object-fit: contain;
    background: #090d16;
    display: block;
  }
  .card .meta {
    padding: 8px;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: rgba(255,255,255,0.02);
  }
  .card .num {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--accent-glow);
    font-size: 11px;
    font-weight: bold;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    backdrop-filter: blur(4px);
  }
  .card .del {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(239, 68, 68, 0.85);
    color: #fff;
    border: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    transition: 0.2s;
  }
  .card .del:hover { background: #ef4444; transform: scale(1.1); }

  .bar { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 28px; }
  button.act {
    flex: 1;
    min-width: 150px;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .primary {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-glow));
    color: #fff;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
  }
  .primary:hover:not(:disabled) {
    opacity: 0.95;
    box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
    transform: translateY(-1px);
  }
  .primary:disabled {
    background: #334155;
    color: #64748b;
    box-shadow: none;
    cursor: not-allowed;
  }
  .ghost {
    background: rgba(255,255,255,0.05);
    color: var(--text-main);
    border: 1px solid var(--border-color);
  }
  .ghost:hover { background: rgba(255,255,255,0.1); }

  #status { margin-top: 16px; font-size: 13px; text-align: center; color: var(--text-muted); min-height: 18px; }
  .prog { height: 6px; background: #1e293b; border-radius: 4px; overflow: hidden; margin-top: 12px; display: none; }
  .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent-blue), var(--accent-glow)); transition: 0.2s; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <!-- จุดใส่โลโก้: เปลี่ยน URL ใน src เป็นรูปภาพโลโก้ของคุณชินอิจิได้เลยค่ะ -->
    <div class="logo-box">
      <img src="https://via.placeholder.com/150x50/0f172a/8b5cf6?text=YOUR+LOGO" alt="Logo">
    </div>
    
    <h1>🖼️ แปลงรูปภาพเป็น PDF</h1>
    <p>ประมวลผลในเครื่องคุณทั้งหมด • รองรับ JPG, PNG, WEBP, GIF, BMP</p>
  </header>

  <div class="body">
    <div id="drop">
      <div class="icon">📁</div>
      <b>คลิกเพื่อเลือกไฟล์ หรือลากรูปมาวางที่นี่</b>
      <span>เลือกได้หลายไฟล์พร้อมกัน • ลากการ์ดเพื่อจัดลำดับหน้า</span>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>

    <div class="opts">
      <div class="opt">
        <label>ขนาดหน้ากระดาษ</label>
        <select id="size">
          <option value="a4">A4 (210×297 มม.)</option>
          <option value="letter">Letter</option>
          <option value="a3">A3</option>
          <option value="a5">A5</option>
          <option value="fit">พอดีกับขนาดรูป</option>
        </select>
      </div>
      <div class="opt">
        <label>แนวกระดาษ</label>
        <select id="orient">
          <option value="auto">อัตโนมัติ (ตามรูป)</option>
          <option value="p">แนวตั้ง</option>
          <option value="l">แนวนอน</option>
        </select>
      </div>
      <div class="opt">
        <label>ระยะขอบ (มม.)</label>
        <input type="number" id="margin" value="10" min="0" max="50">
      </div>
      <div class="opt">
        <label>คุณภาพ: <span id="qv">85%</span></label>
        <input type="range" id="quality" min="30" max="100" value="85">
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="bar">
      <button class="act primary" id="go" disabled>📄 สร้าง PDF</button>
      <button class="act ghost" id="clear">🗑️ ล้างทั้งหมด</button>
    </div>
    <div class="prog" id="prog"><i></i></div>
    <div id="status"></div>
  </div>
</div>

<script>
const { jsPDF } = window.jspdf;
const $ = id => document.getElementById(id);
let items = [], dragIdx = null;

$('quality').oninput = e => $('qv').textContent = e.target.value + '%';

// ---------- เลือก / ลากไฟล์ ----------
$('drop').onclick = () => $('file').click();
$('file').onchange = e => addFiles(e.target.files);
['dragover','dragenter'].forEach(t => $('drop').addEventListener(t, e => {
  e.preventDefault(); $('drop').classList.add('over');
}));
['dragleave','drop'].forEach(t => $('drop').addEventListener(t, e => {
  e.preventDefault(); $('drop').classList.remove('over');
}));
$('drop').addEventListener('drop', e => addFiles(e.dataTransfer.files));

function addFiles(list){
  [...list].filter(f => f.type.startsWith('image/')).forEach(f => {
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      items.push({file:f, url, w:img.naturalWidth, h:img.naturalHeight});
      render();
    };
    img.src = url;
  });
  $('file').value = '';
}

// ---------- แสดงผล + จัดลำดับ ----------
function render(){
  $('grid').innerHTML = items.map((it,i) => `
    <div class="card" draggable="true" data-i="${i}">
      <div class="num">${i+1}</div>
      <button class="del" data-del="${i}">×</button>
      <img src="${it.url}">
      <div class="meta">${it.w}×${it.h} • ${(it.file.size/1024).toFixed(0)} KB</div>
    </div>`).join('');
  $('go').disabled = items.length === 0;
  $('status').textContent = items.length ? `เลือกไว้ ${items.length} รูป` : '';

  $('grid').querySelectorAll('.del').forEach(b => b.onclick = e => {
    e.stopPropagation();
    URL.revokeObjectURL(items[+b.dataset.del].url);
    items.splice(+b.dataset.del, 1); render();
  });
  $('grid').querySelectorAll('.card').forEach(c => {
    c.ondragstart = () => { dragIdx = +c.dataset.i; c.classList.add('drag'); };
    c.ondragend   = () => c.classList.remove('drag');
    c.ondragover  = e => e.preventDefault();
    c.ondrop      = e => {
      e.preventDefault();
      const to = +c.dataset.i;
      if (dragIdx === null || dragIdx === to) return;
      items.splice(to, 0, items.splice(dragIdx, 1)[0]);
      render();
    };
  });
}

$('clear').onclick = () => {
  items.forEach(i => URL.revokeObjectURL(i.url));
  items = []; render();
};

// ---------- บีบอัดรูปเป็น JPEG ----------
function compress(item, q){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';                     // กันพื้นหลังโปร่งใสเป็นสีดำ
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0);
      res(c.toDataURL('image/jpeg', q));
    };
    img.src = item.url;
  });
}

// ---------- สร้าง PDF ----------
$('go').onclick = async () => {
  if (!items.length) return;
  const size = $('size').value, orientSel = $('orient').value;
  const margin = Math.max(0, +$('margin').value || 0);
  const q = +$('quality').value / 100;

  $('go').disabled = true;
  $('prog').style.display = 'block';
  let pdf = null;

  try {
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      $('status').textContent = `กำลังประมวลผล ${i+1}/${items.length}...`;
      $('prog').firstElementChild.style.width = ((i / items.length) * 100) + '%';
      await new Promise(r => setTimeout(r, 0));

      const data = await compress(it, q);
      const auto = it.w >= it.h ? 'l' : 'p';
      const o = orientSel === 'auto' ? auto : orientSel;

      if (size === 'fit') {
        const fmt = [it.w * 0.2646, it.h * 0.2646];   // px → mm (96dpi)
        if (!pdf) pdf = new jsPDF({unit:'mm', format:fmt, orientation:'p'});
        else pdf.addPage(fmt, 'p');
        pdf.addImage(data, 'JPEG', 0, 0, fmt[0], fmt[1]);
      } else {
        if (!pdf) pdf = new jsPDF({unit:'mm', format:size, orientation:o});
        else pdf.addPage(size, o);
        const pw = pdf.internal.pageSize.getWidth();
        const ph = pdf.internal.pageSize.getHeight();
        const aw = pw - margin * 2, ah = ph - margin * 2;
        const r = Math.min(aw / it.w, ah / it.h);
        const w = it.w * r, h = it.h * r;
        pdf.addImage(data, 'JPEG', (pw - w) / 2, (ph - h) / 2, w, h);
      }
    }

    $('prog').firstElementChild.style.width = '100%';
    const name = 'images-' + new Date().toISOString().slice(0,10) + '.pdf';
    pdf.save(name);
    $('status').textContent = `✅ สร้าง PDF สำเร็จ (${items.length} หน้า) — ${name}`;
  } catch (err) {
    $('status').textContent = '❌ เกิดข้อผิดพลาด: ' + err.message;
  } finally {
    $('go').disabled = false;
    setTimeout(() => { $('prog').style.display = 'none'; $('prog').firstElementChild.style.width = '0'; }, 1200);
  }
};
</script>
</body>
</html>
